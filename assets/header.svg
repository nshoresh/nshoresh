<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 150" width="854" height="150" fill="none">
  <style>
    @keyframes waveShift {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-40px); }
    }
    .wave {
      animation: waveShift 6s ease-in-out infinite;
    }
  </style>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2430" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
  </defs>
  <path class="wave" fill="url(#grad)" d="M-50,0 L920,0 L920,112 Q680,152 440,112 T-50,112 Z" />
  <text x="427" y="56" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Shoresh Nick Narowen</text>
  <text x="427" y="94" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">Web & Mobile App Developer</text>
</svg>
